services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: ["nova_mongo:/data/db"]
  app:
    build: .
    restart: unless-stopped
    expose:
      - "3333"
    env_file: .env
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3333/api/ready', (res)=>{process.exit(res.statusCode===200?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
volumes:
  nova_mongo:
